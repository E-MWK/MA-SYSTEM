name: Deploy Vite with Bun to GitHub Pages

on:
  # هيشتغل تلقائي مع أي تعديل يترفع على فرع main
  push:
    branches: ["main"]
  # بيسمحلك تشغل الـ workflow يدوي من جيتهاب لو احتجت
  workflow_dispatch:

# إعطاء الصلاحيات لجيتهاب عشان يقدر يقرأ الكود ويرفع الموقع
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build with Vite
        run: bun run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # المسار اللي TanStack Start/Nitro بيطلع فيه ملفات الموقع النهائية
          path: './.output/public'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
